name: Validate meal tracker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile api/index.py
      - run: python -c "import json; json.load(open('data/state.json', encoding='utf-8'))"

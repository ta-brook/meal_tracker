name: Validate meal tracker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q api
      - run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('data/book/state.json', 'data/jingjing/state.json', 'data/meals.json')]"
